services:
  - type: web
    name: black-heritage-backend
    env: node
    buildCommand: npm install && npm run backend:build
    startCommand: npm run backend:start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: PORT
        value: 10000