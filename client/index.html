<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Brand type only: Playfair Display (display) + DM Sans (body). See DESIGN.md. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <title>Black Heritage Events | Find Where To Go Out in Nigeria</title>
    <meta name="description" content="What's on this weekend? Beach hangouts, concerts, festivals and parties across Lagos, Abuja & PH — buy in 45 seconds with verified e-tickets, or hire trusted DJs, caterers, photographers and sound." />
    <link rel="canonical" href="https://blackhevents.com/" />
    <meta name="keywords" content="concert tickets Nigeria, Lagos events, party tickets Lagos, buy event tickets Nigeria, event vendors Lagos, DJ booking Nigeria" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blackhevents.com/" />
    <meta property="og:title" content="Black Heritage Events | Find Where To Go Out in Nigeria" />
    <meta property="og:description" content="What's on this weekend? Concerts, festivals, beach hangouts and parties across Nigeria — verified e-tickets, pay by card, transfer or USSD. Or list and sell your own event." />
    <meta property="og:image" content="https://blackhevents.com/og-home.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#111114" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://blackhevents.com/" />
    <meta property="twitter:title" content="Black Heritage Events | Find Where To Go Out in Nigeria" />
    <meta property="twitter:description" content="What's on this weekend? Concerts, festivals, beach hangouts and parties across Nigeria — verified e-tickets, pay by card, transfer or USSD. Or list and sell your own event." />
    <meta property="twitter:image" content="https://blackhevents.com/og-home.png" />

    <!-- Structured data: who we are, what the site does -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://blackhevents.com/#org",
          "name": "Black Heritage Events & Entertainment",
          "url": "https://blackhevents.com/",
          "logo": "https://blackhevents.com/favicon.png",
          "description": "Discover and book concerts, festivals, beach hangouts and parties across Nigeria — or list your own event and sell tickets with verified e-tickets. Hire trusted DJs, caterers, photographers and more."
        },
        {
          "@type": "WebSite",
          "@id": "https://blackhevents.com/#site",
          "name": "Black Heritage Events",
          "publisher": { "@id": "https://blackhevents.com/#org" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://blackhevents.com/explore?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- WhatsApp / iMessage -->
    <meta property="og:site_name" content="Black Heritage Events" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <style>
      /* Force Paystack iframe to be visible and interactive over Radix UI Dialog */
      iframe[src*="paystack"], .paystack-modal, #paystack-iframe, .paystack-iframe {
        z-index: 99999999 !important;
        position: fixed !important;
        pointer-events: auto !important;
      }
      /* Ensure nothing else is blocking interactions when Paystack is open */
      body.paystack-open {
        overflow: hidden !important;
      }
      /* Prevent Radix Dialog's pointer-events: none from affecting Paystack */
      [data-radix-focus-guard], [data-radix-popper-content-wrapper] {
        z-index: 10 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
