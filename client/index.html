<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Brand type only: Playfair Display (display) + DM Sans (body). See DESIGN.md. -->
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <title>Black Heritage Events & Entertainment | Experience the Vibes</title>
    <meta name="description" content="Get ready for the hottest Naija parties, elite cultural shows, and non-stop entertainment. Join the heritage, feel the vibes, and secure your spot at the most exclusive events in Nigeria." />
    <meta name="keywords" content="Lagos nightlife, Naija parties, Nigerian entertainment, cultural vibes, concert tickets Nigeria, Black Heritage Events & Entertainment" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blackhevents.com/" />
    <meta property="og:title" content="Black Heritage Events & Entertainment | Experience the Vibes" />
    <meta property="og:description" content="The ultimate destination for Nigeria's most talked-about parties and shows. Don't miss out on the energy—get your tickets and come have the time of your life!" />
    <meta property="og:image" content="/favicon.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://blackhevents.com/" />
    <meta property="twitter:title" content="Black Heritage Events & Entertainment | Experience the Vibes" />
    <meta property="twitter:description" content="The ultimate destination for Nigeria's most talked-about parties and shows. Don't miss out on the energy—get your tickets and come have the time of your life!" />
    <meta property="twitter:image" content="/favicon.png" />

    <!-- WhatsApp / iMessage -->
    <meta property="og:site_name" content="Black Heritage Events" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <style>
      /* Force Paystack iframe to be visible and interactive over Radix UI Dialog */
      iframe[src*="paystack"], .paystack-modal, #paystack-iframe, .paystack-iframe {
        z-index: 99999999 !important;
        position: fixed !important;
        pointer-events: auto !important;
      }
      /* Ensure nothing else is blocking interactions when Paystack is open */
      body.paystack-open {
        overflow: hidden !important;
      }
      /* Prevent Radix Dialog's pointer-events: none from affecting Paystack */
      [data-radix-focus-guard], [data-radix-popper-content-wrapper] {
        z-index: 10 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
